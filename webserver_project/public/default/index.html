<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">LaunchPad</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section" id="home">
        <div class="hero-content">
            <h1 id="dynamic-greeting">Welcome!</h1>
            <p>We're absolutely thrilled to have you here. Explore around, check out what we do, and make yourself right at home.</p>
            <button id="explore-btn" class="cta-btn">Explore Now</button>
        </div>
        
        <div class="hero-image">
            <!-- Ensure your image is named welcome.png and sits in the same directory -->
            <img src="welcome.png" alt="Welcoming Graphic" id="welcome-img">
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 LaunchPad. Built with care.</p>
    </footer>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
